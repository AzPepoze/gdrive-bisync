name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Prepare Config
        run: |
          mkdir -p dist/linux/config
          mkdir -p dist/windows/config
          cp config/config.example.json dist/linux/config/
          cp config/config.example.json dist/windows/config/

      - name: Build Linux
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o dist/linux/gdrive-bisync cmd/gdrive-bisync/main.go
          cd dist/linux
          zip -r ../../linux-gdrive-bisync.zip .

      - name: Build Windows
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -o dist/windows/gdrive-bisync.exe cmd/gdrive-bisync/main.go
          cd dist/windows
          zip -r ../../windows-gdrive-bisync.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            linux-gdrive-bisync.zip
            windows-gdrive-bisync.zip
          generate_release_notes: true
